<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Firma tu contrato | 7Legend</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--t:#1D1D1F;--t2:#3A3A3F;--g:#6E6E76;--g2:#9A9AA2;--l:#E6E7EB;--s:#F5F6F8;--a:#1E6BFF;--ah:#155BE6;--as:#EAF1FF;--r:#E5484D;--rs:#FDECEC;--v:#16A34A;--vs:#E8F7EE;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,system-ui,sans-serif;color:var(--t);background:var(--s);-webkit-font-smoothing:antialiased;line-height:1.55}
.top{background:#fff;border-bottom:1px solid var(--l);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:21px;letter-spacing:-.045em}.logo i{font-style:normal;color:var(--a)}
.top span{font-size:13px;color:var(--g)}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:24px;margin-bottom:16px}
h1{font-size:28px;letter-spacing:-.04em;line-height:1.15}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.res div{background:var(--s);border-radius:12px;padding:12px}
.res small{display:block;font-size:12px;color:var(--g)}.res b{font-size:15.5px}
@media(max-width:600px){.res{grid-template-columns:1fr 1fr}h1{font-size:24px}}
.pasos{display:flex;gap:8px;margin-top:16px;font-size:13.5px;color:var(--g);flex-wrap:wrap}
.pasos span{background:var(--as);color:var(--a);font-weight:600;border-radius:999px;padding:4px 10px}
.texto{max-height:420px;overflow:auto;border:1px solid var(--l);border-radius:14px;padding:18px 20px;font-size:14.5px;color:var(--t2);background:#FCFCFD}
.texto h2{font-size:15px;color:var(--t);margin:16px 0 4px}.texto h2:first-child{margin-top:0}
.texto p{margin-bottom:8px}.texto .ph{color:var(--g2);background:var(--s);border-radius:4px;padding:0 4px}
.texto .pl{font-size:16px}
.texto table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 10px}
.texto th,.texto td{border:1px solid var(--l);padding:6px 8px;text-align:left;vertical-align:top}
.texto th{background:var(--s)}.texto td.sel{background:var(--as);font-weight:600;color:var(--t)}
.leido{font-size:13px;color:var(--g);margin-top:8px}
h3{font-size:18px;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:14px;color:var(--g);margin-bottom:16px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos .full{grid-column:1/-1}
@media(max-width:600px){.campos{grid-template-columns:1fr}}
label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
label small{font-weight:400;color:var(--g)}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--l);border-radius:12px;background:#fff;color:var(--t)}
input[type=text]:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px var(--as)}
.lienzo{position:relative;border:2px dashed #C9CDD6;border-radius:14px;background:#fff;touch-action:none;height:190px}
.lienzo canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;cursor:crosshair}
.lienzo .guia{position:absolute;left:24px;right:24px;bottom:44px;border-top:1px solid var(--l);pointer-events:none}
.lienzo .ph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--g2);font-size:15px;pointer-events:none}
.lienzo.lleno .ph{display:none}
.lz-pie{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--g)}
.lz-pie button{all:unset;cursor:pointer;color:var(--a);font-weight:600}
.acepto{display:flex;gap:12px;align-items:flex-start;margin:18px 0;font-size:14.5px;font-weight:400;color:var(--t2);cursor:pointer}
.acepto input{width:20px;height:20px;margin-top:2px;accent-color:var(--a);flex:none}
.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;background:var(--a);color:#fff;font:inherit;font-weight:600;font-size:16.5px;border:0;border-radius:14px;padding:16px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--ah)}.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,input:focus-visible{outline:3px solid #9EC1FF;outline-offset:2px}
.err{background:var(--rs);color:#A8282D;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:none}
.seg{font-size:12.5px;color:var(--g);text-align:center;margin-top:12px;line-height:1.5}
.estado{text-align:center;padding:40px 24px}
.estado .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--vs);color:var(--v);font-size:30px}
.estado p{color:var(--g);margin-top:8px}
.cargando{text-align:center;color:var(--g);padding:60px 0}
</style>
</head>
<body>
<div class="top"><span class="logo">7Legend<i>.</i></span><span id="cod"></span></div>
<main id="app"><p class="cargando">Cargando tu contrato…</p></main>

<script>
const $=id=>document.getElementById(id);
const h=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const soles=n=>'S/'+Number(n).toLocaleString('en-US');
const TOKEN=new URLSearchParams(location.search).get('c')||'';
let C=null, firmo=false;

function fin(ic,t,txt){ $('app').innerHTML=`<div class="card estado"><div class="ic">${ic}</div><h1>${t}</h1><p>${txt}</p></div>`; scrollTo(0,0); }

async function cargar(){
  if(!TOKEN||!window.CFG||!CFG.API_URL) return fin('!','Enlace incompleto','Abre el enlace completo que te llegó por correo.');
  try{ C=await (await fetch(CFG.API_URL+'?action=contrato&t='+encodeURIComponent(TOKEN))).json(); }
  catch(e){ return fin('!','No pudimos cargar tu contrato','Revisa tu conexión y vuelve a abrir el enlace.'); }
  if(!C.ok) return fin('!','Enlace no válido',h(C.error||''));
  $('cod').textContent=C.id;
  if(C.estado==='Firmado') return fin('✓','Este contrato ya está firmado',`Se firmó el ${h(C.firmado.slice(0,16))}. Te enviamos la copia en PDF a ${h(C.email)}.`);
  pintar();
}

function partesHTML(d){
  const v=(x,ph)=>x?`<b>${h(x)}</b>`:`<span class="ph">${ph}</span>`, P=C.prestador;
  return `<p><b>EL PRESTADOR:</b> ${h(P.nombre)}, con RUC ${h(P.ruc)}, con domicilio en ${h(P.domicilio)}, que opera bajo el nombre comercial <b>7Legend</b>.</p>`+
    `<p><b>EL CLIENTE:</b> ${v(d.razon_social,'[razón social o nombre]')}${d.ruc?', con RUC '+v(d.ruc):''}, con domicilio en ${v(d.domicilio,'[domicilio]')}, representado por ${v(d.representante,'[tu nombre completo]')}, identificado con DNI ${v(d.dni,'[DNI]')}.</p>`;
}

function pintar(){
  const D=C.datos||{};
  $('app').innerHTML=`
  <div class="card">
    <h1>Tu contrato con 7Legend</h1>
    <div class="res"><div><small>Plan</small><b>${h(C.plan)}</b></div><div><small>Precio</small><b>${soles(C.precio)}${C.mensual?' al mes':''}</b></div><div><small>Inicio</small><b>${h(C.inicio)}</b></div><div><small>${C.mensual?'Permanencia':'Duración'}</small><b>${C.mensual?'3 meses mín.':'1 mes'}</b></div></div>
    <div class="pasos"><span>1. Lee el contrato</span><span>2. Completa tus datos</span><span>3. Firma</span></div>
  </div>
  <div class="card">
    <h3>Contrato</h3><p class="sub">Desliza para leerlo completo.</p>
    <div class="texto" id="texto">${C.secciones.map((s,i)=>`<h2>${h(s[0])}</h2><div${i===0?' id="partes"':''}>${i===0?partesHTML(D):s[1]}</div>`).join('')}</div>
  </div>
  <form class="card" id="f" novalidate>
    <h3>Tus datos</h3><p class="sub">Aparecerán en el contrato como EL CLIENTE.</p>
    <div class="campos">
      <div class="full"><label for="razon_social">Razón social o nombre del negocio</label><input type="text" id="razon_social" autocomplete="organization" value="${h(D.razon_social)}"></div>
      <div><label for="ruc">RUC <small>(opcional)</small></label><input type="text" id="ruc" inputmode="numeric" maxlength="11" value="${h(D.ruc)}"></div>
      <div><label for="dni">DNI o carné de extranjería</label><input type="text" id="dni" inputmode="numeric" maxlength="12" value="${h(D.dni)}"></div>
      <div class="full"><label for="representante">Tu nombre completo</label><input type="text" id="representante" autocomplete="name" value="${h(D.representante)}"></div>
      <div class="full"><label for="domicilio">Domicilio</label><input type="text" id="domicilio" autocomplete="street-address" value="${h(D.domicilio)}"></div>
    </div>
    <h3 style="margin-top:22px">Tu firma</h3><p class="sub">Dibuja tu firma con el dedo o el mouse.</p>
    <div class="lienzo" id="lz"><canvas id="cv" aria-label="Recuadro para dibujar tu firma"></canvas><div class="guia"></div><div class="ph">Firma aquí</div></div>
    <div class="lz-pie"><span>Firma igual que en tu DNI.</span><button type="button" id="borrar">Borrar firma</button></div>
    <label class="acepto"><input type="checkbox" id="acepto"><span>Leí el contrato y acepto sus términos. Entiendo que firmar aquí tiene el mismo valor que mi firma a mano.</span></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="firmar" type="submit">Firmar contrato</button>
    <p class="seg">🔒 Enlace único enviado a ${h(C.email)}. Al firmar recibirás una copia en PDF.</p>
  </form>`;
  ['razon_social','ruc','dni','representante','domicilio'].forEach(k=>$(k).addEventListener('input',()=>{ $('partes').innerHTML=partesHTML(datos()); }));
  lienzo();
  $('f').onsubmit=enviar;
}
function datos(){ const o={}; ['razon_social','ruc','dni','representante','domicilio'].forEach(k=>o[k]=$(k).value.trim()); return o; }

/* lienzo de firma */
let trazos=0;
function lienzo(){
  const cv=$('cv'), lz=$('lz'), ctx=cv.getContext('2d'); let dib=false, last=null;
  const ajustar=()=>{ const r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14141A'; trazos=0; lz.classList.remove('lleno'); };
  ajustar(); addEventListener('resize',()=>{ if(!trazos) ajustar(); });
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown',e=>{ dib=true; last=pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle='#14141A'; ctx.fill(); });
  cv.addEventListener('pointermove',e=>{ if(!dib) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; trazos++; lz.classList.add('lleno'); });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{ dib=false; }));
  $('borrar').onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); trazos=0; lz.classList.remove('lleno'); };
}
function firmaPNG(){
  const cv=$('cv'), o=document.createElement('canvas'); o.width=600; o.height=Math.round(600*cv.height/cv.width);
  o.getContext('2d').drawImage(cv,0,0,o.width,o.height); return o.toDataURL('image/png');
}

async function enviar(e){
  e.preventDefault(); if(firmo) return;
  const err=$('err'), b=$('firmar'), d=datos(); err.style.display='none';
  const mal=t=>{ err.textContent=t; err.style.display='block'; err.scrollIntoView({block:'center',behavior:'smooth'}); };
  if(d.razon_social.length<2) return mal('Escribe la razón social o el nombre de tu negocio.');
  if(d.representante.split(/\s+/).length<2) return mal('Escribe tu nombre completo (nombre y apellido).');
  if(!/^\d{8}$|^[A-Za-z0-9]{9,12}$/.test(d.dni)) return mal('Revisa tu DNI: son 8 dígitos.');
  if(d.ruc&&!/^(10|15|17|20)\d{9}$/.test(d.ruc)) return mal('Revisa el RUC (11 dígitos) o déjalo vacío.');
  if(d.domicilio.length<5) return mal('Escribe tu domicilio.');
  if(trazos<8) return mal('Dibuja tu firma en el recuadro.');
  if(!$('acepto').checked) return mal('Marca la casilla para aceptar el contrato.');
  b.disabled=true; b.textContent='Firmando…';
  try{
    const r=await (await fetch(CFG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:'firmar',c:TOKEN,firma:firmaPNG(),acepto:true,ua:navigator.userAgent.slice(0,160)},d))})).json();
    if(!r.ok){ b.disabled=false; b.textContent='Firmar contrato'; return mal(r.error||'No se pudo firmar. Intenta otra vez.'); }
    firmo=true;
    fin('✓','¡Listo, tu contrato está firmado!',`Te enviamos la copia en PDF a ${h(C.email)}. En breve te escribo por WhatsApp para coordinar el arranque.`);
  }catch(x){ b.disabled=false; b.textContent='Firmar contrato'; mal('Revisa tu conexión e intenta otra vez.'); }
}
cargar();
</script>
</body>
</html>
